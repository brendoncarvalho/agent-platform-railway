[project]
name = "agentos"
version = "1.0.0"
description = "AgentOS: a production API for agents."
requires-python = ">=3.12,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  "agno[os,mcp,slack,pgvector,psycopg]==3.1.12",
  "agnoctl==0.2.0",
  "ddgs",
  "jira==3.10.5",
  "openai",
  "playwright",
  "pypdf",
  "python-docx",
  "python-dotenv",
  "pyyaml",
  "reportlab",
  "trafilatura",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "pytest-asyncio", "ruff", "types-PyYAML"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*"]
