manifest:
  # --- Agents ---

  assistente-pemill:
    description: "Assistente virtual da Pemill: conversa geral em português, análise de imagens enviadas e geração/edição de imagens."
    quick_prompts:
      - "Me ajude a redigir um e-mail para um cliente sobre atraso na entrega"
      - "O que esta imagem mostra? (anexe uma imagem)"
      - "Gere uma imagem de um banner comemorativo para a equipe"

  crm-note-autofix:
    description: "Revisor automático de registros comerciais de ligações e visitas. Corrige gramática, pontuação e clareza mantendo o sentido original."
    quick_prompts:
      - "Revise este texto de ligação comercial"
      - "Corrija a gramática deste registro de visita"
      - "Melhore a clareza deste apontamento"

  jira-ticket-responder:
    description: "Atendimento de chamados Jira em portugues. Le chamados, comenta respostas e so edita comentarios criados pela propria ferramenta de IA."
    quick_prompts:
      - "Responda o chamado JIRA-123 conforme estas instrucoes..."
      - "Busque os chamados abertos do projeto SUP e prepare respostas"
      - "Edite o comentario de IA no chamado JIRA-123"

  hr-resume-analyst:
    description: "Apoio à triagem de currículos para o RH. Lê currículos em PDF, DOCX ou texto, compara com a vaga por critérios e evidências e sugere perguntas de entrevista. A decisão é sempre do RH."
    quick_prompts:
      - "Analise o currículo em anexo para a vaga que descrevo a seguir"
      - "Compare os currículos em anexo para a vaga e sugira quem entrevistar"
      - "Resuma o perfil profissional do currículo em anexo"

  # --- Teams ---

  ti-team:
    description: "Time de atendimento de TI em portugues. Coordena triagem, Jira, duvidas tecnicas, imagens e arquivos."
    quick_prompts:
      - "Triar este chamado de TI"
      - "Gere uma imagem para o comunicado de manutencao programada"
      - "Verifique o status do chamado JIRA-123 e sugira a resposta"
      - "Gere um PDF com o resumo deste atendimento"
