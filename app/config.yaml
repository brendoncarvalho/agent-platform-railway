manifest:
  # --- Agents ---

  chief:
    description: "The team mascot. Tell Chief anything (decisions, what you learned, what you had for lunch)."
    quick_prompts:
      - "What's up chief?"
      - "Hey Chief, we're getting zapatos from garaje"
      - "Chief, we're going with planetscale over RDS"

  agent-builder:
    description: "Creates agents, teams, and workflows using the AgentOS Studio."
    quick_prompts:
      - "Build an agent like chief but sassier"
      - "Build an agent that tracks AI news and writes a daily brief"
      - "Build a multi-agent team with the chief and platform manager"

  platform-manager:
    description: "Understands, monitors, and explains this AgentOS. Codebase context, runtime diagnostics, usage patterns."
    quick_prompts:
      - "Tell me about this AgentOS"
      - "Share some usage patterns"
      - "Which agent is slowest, and is anything failing?"

  crm-note-autofix:
    description: "Revisor automático de registros comerciais de ligações e visitas. Corrige gramática, pontuação e clareza mantendo o sentido original."
    quick_prompts:
      - "Revise este texto de ligação comercial"
      - "Corrija a gramática deste registro de visita"
      - "Melhore a clareza deste apontamento"

  general-chat:
    description: "Assistente de conversação geral em português, com acesso a web e memória de usuário."
    quick_prompts:
      - "Qual é a situação atual do mercado de IA?"
      - "Me explique sobre este assunto"
      - "Pesquise as últimas novidades sobre..."

  jira-ticket-responder:
    description: "Atendimento de chamados Jira em portugues. Le chamados, comenta respostas e so edita comentarios criados pela propria ferramenta de IA."
    quick_prompts:
      - "Responda o chamado JIRA-123 conforme estas instrucoes..."
      - "Busque os chamados abertos do projeto SUP e prepare respostas"
      - "Edite o comentario de IA no chamado JIRA-123"

  # --- Teams ---

  ti-team:
    description: "Time de atendimento de TI em portugues. Coordena triagem, Jira, diagnosticos e arquivos."
    quick_prompts:
      - "Triar este chamado de TI"
      - "Verifique o status do chamado JIRA-123 e sugira a resposta"
      - "Gere um PDF com o resumo deste atendimento"
      - "Diagnostique este problema na plataforma"

  # --- Workflows ---

  deployment-check:
    description: "Run a deployment check to verify the AgentOS is running correctly."
    quick_prompts:
      - "Run the deployment check"

  run-evals:
    description: "Run a subset of the eval suite."
    quick_prompts:
      - "Run the smoke evals"
