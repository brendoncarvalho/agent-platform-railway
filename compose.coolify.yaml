services:
  agentos-db:
    image: agnohq/pgvector:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-ai}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_DATABASE:-ai}

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-ai} -d ${DB_DATABASE:-ai}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  agentos-api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    expose:
      - "8000"

    # /health is public (exempt from JWT) and only answers once the lifespan startup has finished.
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    environment:
      # prd turns on JWT auth: the app refuses to serve without JWT_VERIFICATION_KEY.
      RUNTIME_ENV: ${RUNTIME_ENV:-prd}
      AGNO_DEBUG: ${AGNO_DEBUG:-False}
      WAIT_FOR_DB: "True"

      AGENTOS_URL: ${AGENTOS_URL:-http://127.0.0.1:8000}

      DB_HOST: agentos-db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-ai}
      DB_PASS: ${DB_PASS}
      DB_DATABASE: ${DB_DATABASE:-ai}
      DB_DRIVER: postgresql+psycopg

      # Defaults below mirror the code defaults: an empty string is not the same as unset.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-~openai/gpt-mini-latest}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-8192}

      JWT_VERIFICATION_KEY: ${JWT_VERIFICATION_KEY:-}
      MCP_CONNECT_SECRET: ${MCP_CONNECT_SECRET:-}
      AGENTOS_MCP_SIGNING_KEY: ${AGENTOS_MCP_SIGNING_KEY:-}

      JIRA_AUTH_TYPE: ${JIRA_AUTH_TYPE:-}
      JIRA_SERVER_URL: ${JIRA_SERVER_URL:-}
      JIRA_USERNAME: ${JIRA_USERNAME:-}
      JIRA_TOKEN: ${JIRA_TOKEN:-}
      JIRA_PASSWORD: ${JIRA_PASSWORD:-}
      JIRA_OAUTH_CLIENT_ID: ${JIRA_OAUTH_CLIENT_ID:-}
      JIRA_OAUTH_CLIENT_SECRET: ${JIRA_OAUTH_CLIENT_SECRET:-}
      JIRA_OAUTH_ACCESS_TOKEN: ${JIRA_OAUTH_ACCESS_TOKEN:-}
      JIRA_CLOUD_ID: ${JIRA_CLOUD_ID:-}
      JIRA_OAUTH_ACCESS_TOKEN_SECRET: ${JIRA_OAUTH_ACCESS_TOKEN_SECRET:-}
      JIRA_OAUTH_CONSUMER_KEY: ${JIRA_OAUTH_CONSUMER_KEY:-}
      JIRA_OAUTH_KEY_CERT: ${JIRA_OAUTH_KEY_CERT:-}
      JIRA_ENABLE_MUTATIONS: ${JIRA_ENABLE_MUTATIONS:-False}

      ROCKETCHAT_WEBHOOK_TOKEN: ${ROCKETCHAT_WEBHOOK_TOKEN:-}
      ROCKETCHAT_AGENT_ID: ${ROCKETCHAT_AGENT_ID:-assistente-pemill}
      ROCKETCHAT_BOT_USERNAME: ${ROCKETCHAT_BOT_USERNAME:-}

      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}

      # Assistente Pemill — chat/image providers and limits (see example.env)
      CHAT_MODEL_PROVIDER: ${CHAT_MODEL_PROVIDER:-openrouter}
      CHAT_MODEL_ID: ${CHAT_MODEL_ID:-}
      ASSISTENTE_PEMILL_MEMORY: ${ASSISTENTE_PEMILL_MEMORY:-True}
      ASSISTENTE_PEMILL_HISTORY_RUNS: ${ASSISTENTE_PEMILL_HISTORY_RUNS:-10}
      ASSISTENTE_PEMILL_MAX_TOKENS: ${ASSISTENTE_PEMILL_MAX_TOKENS:-4096}
      WEB_SEARCH: ${WEB_SEARCH:-True}
      WEB_SEARCH_BACKEND: ${WEB_SEARCH_BACKEND:-google}
      WEB_SEARCH_REGION: ${WEB_SEARCH_REGION:-br-pt}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-openrouter}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_SIZE: ${IMAGE_SIZE:-1024x1024}
      IMAGE_QUALITY: ${IMAGE_QUALITY:-auto}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_INPUT_MAX_MB: ${IMAGE_INPUT_MAX_MB:-10}
      IMAGE_INPUT_FORMATS: ${IMAGE_INPUT_FORMATS:-png,jpeg,webp}
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_STORAGE_DIR: /app/storage/media
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_PREFIX: ${MEDIA_S3_PREFIX:-pemill/media/}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-}
      MEDIA_S3_ENDPOINT_URL: ${MEDIA_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

    volumes:
      # Generated and uploaded images when MEDIA_STORAGE=local.
      - media:/app/storage/media

    depends_on:
      agentos-db:
        condition: service_healthy

    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  pgdata:
  media:
